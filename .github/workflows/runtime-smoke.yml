name: Write It browser smoke

on:
  push:
    branches:
      - main
      - feat/polyphonic-data-v2-release
  pull_request:
    paths:
      - ".github/workflows/runtime-smoke.yml"
      - "src/**"
      - "content/**"
      - "sources/**"
      - "reports/**"
      - "scripts/build-polyphonic.py"
      - "scripts/build-data.py"
      - "tests/**"
      - "static/zi/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate polyphonic data
        run: python3 -m unittest discover -s tests -p 'test_polyphonic.py'
      - name: Write updated data-v2 index
        if: github.event_name == 'push'
        run: python3 scripts/build-polyphonic.py --write
      - name: Verify committed data-v2 snapshot
        if: github.event_name == 'pull_request'
        run: python3 scripts/build-polyphonic.py --check
      - name: Verify complete pronunciation inventory
        run: python3 scripts/build-polyphonic.py --check-audit
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build the deployment JS
        run: npm run build
      - name: Verify checked-in app.js matches the source
        run: git diff --exit-code -- static/zi/app.js
      - name: Verify no generated data changes
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- static/zi/data/characters.json static/zi/data/polyphonic.json
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run isolated PWA smoke suite
        run: npm run test:smoke
      - name: Commit regenerated multi-reading index
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/polyphonic-data-v2-release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/zi/data/characters.json static/zi/data/polyphonic.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh full reference-backed reading index [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
